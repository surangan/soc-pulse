# SoC Pulse server-side scanner
# Runs hourly on GitHub's servers, scans public sources, and commits
# the results to data/mentions.json, which the dashboard reads.
# Reddit and Bluesky need free credentials - see SETUP.md.
# NUSWhispers and Hacker News work with no setup at all.

name: SoC Pulse scan

on:
  schedule:
    - cron: '17 * * * *'   # hourly at :17 (offset avoids GitHub's on-the-hour congestion)
  workflow_dispatch:        # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write

concurrency:
  group: soc-pulse-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run scanner
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: node scan.mjs

      - name: Commit results
        run: |
          git config user.name "soc-pulse-bot"
          git config user.email "actions@github.com"
          git add data/mentions.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Scheduled scan: update mentions data"
            git push
          fi
